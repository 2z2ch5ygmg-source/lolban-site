<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>롤벤 마스터 콘솔</title>
<link rel="icon" type="image/svg+xml" href="/img/lolban-favicon.svg">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<!-- 마스터 콘솔(11-24 사용자 「이용자 분석 — 몇 명, 누구, 어떤 경로로 로그인했는지」): 서버 /admin/console이 마스터 계정(ADMIN_UIDS)만 답함. 이 페이지는 롤벤에서 로그인한 세션을 그대로 씀 -->
<style>
:root{--bg:#F4F3EF;--panel:#fff;--panel2:#F0EFEA;--text:#16161A;--muted:#5C5D66;--dim:#8A8B94;--line:#E4E3DD;--bar:#5B3FE0;--bar2:#9A8AF0;--good:#1F7A4D;--bad:#D42F3C}
@media (prefers-color-scheme:dark){:root{--bg:#0D0D0F;--panel:#17171A;--panel2:#1F1F23;--text:#F2F2F4;--muted:#A9AAB0;--dim:#74757E;--line:#2A2A30;--bar:#9C8CFF;--bar2:#5E52A8;--good:#4FD68C;--bad:#FF5468}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:22px 20px 60px}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
header h1{font-size:20px;margin:0;letter-spacing:-.02em}header small{color:var(--dim)}
.sp{flex:1}
.seg{display:inline-flex;background:var(--panel2);border-radius:10px;padding:3px}
.seg button{border:0;background:none;color:var(--muted);font:inherit;font-weight:700;font-size:13px;padding:6px 12px;border-radius:8px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--panel);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);font:inherit;font-weight:700;font-size:13px;padding:7px 12px;border-radius:10px;cursor:pointer;text-decoration:none}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--panel);border-radius:14px;padding:14px 16px}.kpi b{display:block;font-size:26px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}.kpi span{color:var(--muted);font-size:12.5px;font-weight:600}.kpi i{font-style:normal;color:var(--dim);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:12px;margin-bottom:12px}
.card{background:var(--panel);border-radius:14px;padding:14px 16px;min-width:0}
.card h2{font-size:14px;margin:0 0 10px;display:flex;align-items:baseline;gap:8px}.card h2 small{color:var(--dim);font-weight:600;font-size:12px}
.chart{display:flex;align-items:flex-end;gap:2px;height:120px;border-bottom:1px solid var(--line);position:relative}
.chart .c{flex:1;min-width:0;height:100%;display:flex;align-items:flex-end;cursor:default}
.chart .c i{display:block;width:100%;background:var(--bar);border-radius:4px 4px 0 0;min-height:1px}
.chart .c:hover i{background:var(--bar2)}
.axis{display:flex;justify-content:space-between;color:var(--dim);font-size:11px;margin-top:4px}
.tip{position:fixed;pointer-events:none;background:var(--text);color:var(--bg);font-size:12px;font-weight:600;padding:5px 8px;border-radius:7px;white-space:nowrap;z-index:9;display:none}
.rows{display:grid;gap:6px}.row{display:grid;grid-template-columns:minmax(0,1fr) 54px;gap:8px;align-items:center}
.row .l{position:relative;min-width:0;padding:4px 8px;border-radius:7px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.row .l::before{content:"";position:absolute;inset:0;width:var(--w);background:var(--panel2);border-radius:7px;z-index:0}
.row .l span{position:relative;z-index:1}.row b{text-align:right;font-variant-numeric:tabular-nums}
.empty{color:var(--dim);font-size:13px;padding:8px 0}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--muted);font-weight:700;font-size:12px;cursor:pointer;user-select:none}td.t{white-space:normal;min-width:140px}
.tbl{overflow-x:auto}
.pv{display:inline-block;font-size:11.5px;font-weight:800;padding:1px 8px;border-radius:999px;background:var(--panel2);color:var(--muted)}
.find{border:1px solid var(--line);background:var(--panel);color:var(--text);font:inherit;padding:7px 10px;border-radius:10px;min-width:180px}
.msg{background:var(--panel);border-radius:14px;padding:22px;max-width:560px;margin:60px auto;text-align:center}.msg code{background:var(--panel2);padding:2px 6px;border-radius:6px;font-size:12.5px;word-break:break-all}
.note{color:var(--dim);font-size:12px;margin-top:14px}
.grid{grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr))}
@media (max-width:760px){.wrap{padding:16px 16px 48px}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi b{font-size:22px}.btn,.seg button{min-height:40px}.find{min-width:0;width:100%}}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="msg">불러오는 중…</div></div>
<div class="tip" id="tip"></div>
<script src="/js/config.js"></script>
<script>
(() => {
  const WURL = (window.RECENT_LIVE_URL || "").replace(/\/$/, "");
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const PROV = { google: "구글", naver: "네이버", kakao: "카카오", apple: "Apple" };
  let sess = ""; try { sess = localStorage.getItem("lolban.sess.v1") || ""; } catch (e) { sess = ""; }
  const S = { days: 30, sort: "last", dir: -1, q: "", data: null };
  const app = document.getElementById("app"), tip = document.getElementById("tip");
  const n = (v) => Number(v || 0).toLocaleString("ko-KR");

  async function load() {
    if (!sess) { app.innerHTML = `<div class="msg"><b>로그인이 필요합니다</b><p>롤벤에서 마스터 계정으로 로그인한 뒤 다시 열어 주세요.</p><a class="btn" href="/">롤벤으로 가서 로그인</a></div>`; return; }
    try {
      const r = await fetch(`${WURL}/admin/console?days=${S.days}`, { headers: { "X-Session": sess }, cache: "no-store", credentials: "omit" });
      const d = await r.json().catch(() => ({}));
      if (r.status === 401) { app.innerHTML = `<div class="msg"><b>로그인이 끝났습니다</b><p>롤벤에서 다시 로그인해 주세요.</p><a class="btn" href="/">롤벤으로</a></div>`; return; }
      if (r.status === 403) { app.innerHTML = `<div class="msg"><b>마스터 계정만 볼 수 있습니다</b><p>지금 로그인한 계정의 사용자 번호는</p><p><code>${esc(d.uid || "")}</code></p><p class="note">이 번호를 마스터로 등록하려면 서버에서<br><code>npx wrangler secret put ADMIN_UIDS</code> 로 넣습니다(여럿이면 쉼표로).</p></div>`; return; }
      if (!r.ok || d.status !== "ok") throw new Error(d.reason || r.status);
      S.data = d; render();
    } catch (e) { app.innerHTML = `<div class="msg"><b>불러오지 못했습니다</b><p>${esc(e.message || e)}</p><button class="btn" onclick="location.reload()">다시 시도</button></div>`; }
  }

  const sum = (days, k) => days.reduce((a, d) => a + (d[k] || 0), 0);
  const merge = (days, k) => { const m = {}; days.forEach((d) => Object.entries(d[k] || {}).forEach(([x, v]) => (m[x] = (m[x] || 0) + v))); return Object.entries(m).sort((a, b) => b[1] - a[1]); };
  const md = (s) => s.slice(5).replace("-", "/");

  function chart(days, k, label) {
    const max = Math.max(1, ...days.map((d) => d[k] || 0));
    return `<div class="chart" role="img" aria-label="${esc(label)}">${days.map((d) => `<div class="c" data-tip="${esc(md(d.day))} · ${esc(label)} ${n(d[k])}"><i style="height:${((d[k] || 0) / max) * 100}%"></i></div>`).join("")}</div>
      <div class="axis"><span>${md(days[0].day)}</span><span>최대 ${n(max)}</span><span>${md(days[days.length - 1].day)}</span></div>`;
  }
  function bars(list, fmt) {
    if (!list.length) return `<div class="empty">아직 기록이 없습니다</div>`;
    const max = list[0][1] || 1;
    return `<div class="rows">${list.slice(0, 12).map(([k, v]) => `<div class="row"><div class="l" style="--w:${(v / max) * 100}%" title="${esc(fmt ? fmt(k) : k)}"><span>${esc(fmt ? fmt(k) : k)}</span></div><b>${n(v)}</b></div>`).join("")}</div>`;
  }
  const within = (s, days) => { if (!s) return false; const t = Date.parse(s.replace(" ", "T") + ":00+09:00"); return t && Date.now() - t < days * 864e5; };

  function render() {
    const d = S.data, days = d.days || [], last = days[days.length - 1] || {}, last7 = days.slice(-7);
    const users = d.users || [];
    const byProv = {}; users.forEach((u) => (byProv[u.provider] = (byProv[u.provider] || 0) + 1));
    const q = S.q.trim().toLowerCase();
    const list = users.filter((u) => !q || (u.nick || "").toLowerCase().includes(q) || u.uid.includes(q) || u.teams.some((t) => t.name.toLowerCase().includes(q)))
      .sort((a, b) => { const k = S.sort; const va = k === "teams" ? a.teams.length : a[k] || "", vb = k === "teams" ? b.teams.length : b[k] || ""; return (va > vb ? 1 : va < vb ? -1 : 0) * S.dir; });
    const th = (k, t) => `<th data-sort="${k}" aria-sort="${S.sort === k ? (S.dir > 0 ? "ascending" : "descending") : "none"}">${t}${S.sort === k ? (S.dir > 0 ? " ▲" : " ▼") : ""}</th>`;
    app.innerHTML = `<header><h1>롤벤 마스터 콘솔</h1><small>${new Date(d.at).toLocaleString("ko-KR")} 기준</small><span class="sp"></span>
      <div class="seg" role="group" aria-label="기간">${[7, 30, 90].map((x) => `<button data-days="${x}" aria-pressed="${S.days === x}">${x}일</button>`).join("")}</div>
      <button class="btn" id="re">새로 고침</button><a class="btn" href="/">롤벤으로</a></header>
    <div class="kpis">
      <div class="kpi"><span>가입자</span><b>${n(users.length)}</b><i>최근 7일 신규 ${n(users.filter((u) => within(u.created, 7)).length)}</i></div>
      <div class="kpi"><span>7일 안 로그인</span><b>${n(users.filter((u) => within(u.last, 7)).length)}</b><i>30일 ${n(users.filter((u) => within(u.last, 30)).length)}</i></div>
      <div class="kpi"><span>오늘 방문자</span><b>${n(last.uv)}</b><i>방문 ${n(last.hits)} · 처음 ${n(last.newv)}</i></div>
      <div class="kpi"><span>7일 방문</span><b>${n(sum(last7, "hits"))}</b><i>하루 방문자 합 ${n(sum(last7, "uv"))}</i></div>
      <div class="kpi"><span>팀</span><b>${n(d.teams)}</b><i>내전 구인 글 ${d.scrim == null ? "-" : n(d.scrim)}</i></div>
    </div>
    <div class="grid">
      <div class="card"><h2>하루 방문자<small>최근 ${S.days}일 · 같은 브라우저는 하루 1명</small></h2>${chart(days, "uv", "방문자")}</div>
      <div class="card"><h2>하루 로그인<small>최근 ${S.days}일 · 공급자 합계</small></h2>${chart(days.map((x) => ({ ...x, lg: Object.values(x.login || {}).reduce((a, b) => a + b, 0) })), "lg", "로그인")}</div>
    </div>
    <div class="grid">
      <div class="card"><h2>들어온 곳<small>리퍼러 도메인 · ${S.days}일 방문</small></h2>${bars(merge(days, "ref"))}</div>
      <div class="card"><h2>광고·캠페인<small>utm_source / medium / campaign</small></h2>${bars(merge(days, "utm"))}</div>
      <div class="card"><h2>첫 화면<small>${S.days}일 방문</small></h2>${bars(merge(days, "route"), (k) => ({ "/": "홈", "/draft/": "피어리스 밴픽", "/scrim/": "내전 구인", "/study/": "공부자료", "/guide/": "가이드" }[k] || k))}</div>
      <div class="card"><h2>기기<small>${S.days}일 방문</small></h2>${bars(merge(days, "dev"))}</div>
      <div class="card"><h2>가입 경로<small>전체 가입자 · 로그인 방법</small></h2>${bars(Object.entries(byProv).sort((a, b) => b[1] - a[1]), (k) => PROV[k] || k || "모름")}</div>
      <div class="card"><h2>로그인 횟수<small>${S.days}일 · 신규 가입 ${n(merge(days, "signup").reduce((a, x) => a + x[1], 0))}</small></h2>${bars(merge(days, "login"), (k) => PROV[k] || k)}</div>
    </div>
    <div class="card"><h2>이용자<small>${n(list.length)}명${q ? ` · 「${esc(S.q)}」` : ""} · 이메일·전화번호는 받지 않음</small><span class="sp"></span><input class="find" id="find" placeholder="닉네임·팀·번호 찾기" value="${esc(S.q)}" aria-label="이용자 찾기"></h2>
      <div class="tbl"><table><thead><tr>${th("nick", "닉네임")}${th("provider", "로그인")}${th("created", "가입")}${th("last", "최근 로그인")}${th("teams", "팀")}<th>사용자 번호</th></tr></thead><tbody>
      ${list.slice(0, 500).map((u) => `<tr><td>${esc(u.nick || "(이름 없음)")}${u.uid === d.me ? ` <span class="pv">나</span>` : ""}</td><td><span class="pv">${esc(PROV[u.provider] || u.provider || "-")}</span></td><td>${esc(u.created)}</td><td>${esc(u.last)}</td>
        <td class="t">${u.teams.length ? u.teams.map((t) => `${esc(t.name)}${t.owner ? " (팀장)" : ""} · ${t.members}명`).join("<br>") : "-"}</td><td><code>${esc(u.uid)}</code></td></tr>`).join("")}
      </tbody></table></div>${list.length > 500 ? `<p class="note">500명까지 보입니다. 찾기로 좁혀 주세요.</p>` : ""}</div>
    <p class="note">방문은 페이지를 열 때 한 번 셉니다(웹). 방문자 수는 브라우저마다 만든 무작위 번호를 하루 단위 해시로만 세며 IP·쿠키는 쓰지 않습니다. 하루 합계는 90일 보관. iOS 앱 방문은 다음 앱 업데이트부터 들어옵니다.</p>`;
  }

  app.addEventListener("click", (e) => {
    const b = e.target.closest("[data-days]"); if (b) { S.days = +b.dataset.days; load(); return; }
    if (e.target.closest("#re")) { load(); return; }
    const h = e.target.closest("[data-sort]"); if (h) { const k = h.dataset.sort; S.dir = S.sort === k ? -S.dir : k === "nick" || k === "provider" ? 1 : -1; S.sort = k; render(); }
  });
  app.addEventListener("input", (e) => { if (e.target.id === "find") { S.q = e.target.value; const pos = e.target.selectionStart; render(); const f = document.getElementById("find"); f.focus(); f.setSelectionRange(pos, pos); } });
  app.addEventListener("mousemove", (e) => { const c = e.target.closest("[data-tip]"); if (!c) { tip.style.display = "none"; return; } tip.textContent = c.dataset.tip; tip.style.display = "block"; tip.style.left = Math.min(innerWidth - tip.offsetWidth - 8, e.clientX + 12) + "px"; tip.style.top = e.clientY - 34 + "px"; });
  app.addEventListener("mouseleave", () => (tip.style.display = "none"));
  load();
})();
</script>
</body>
</html>
